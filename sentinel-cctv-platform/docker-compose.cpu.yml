version: '3.8'

services:
  # ============================================================================
  # 1. Central Command & Control Center (Node.js Express + React GIS UI)
  # ============================================================================
  central-platform:
    build:
      context: ./2_CENTRAL_PLATFORM
      dockerfile: Dockerfile
    container_name: gujraksha_central_platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gujraksha
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - AI_STREAM_HOST=ai-stream-service
      - AI_STREAM_PORT=8090
    depends_on:
      - postgres
    networks:
      - gujraksha-net

  # ============================================================================
  # 2. Distributed AI Edge Worker (Python ANPR Engine - CPU Fallback)
  # ============================================================================
  ai-edge-worker:
    build:
      context: ./3_ANPR_EDGE_WORKER
      dockerfile: Dockerfile
    container_name: gujraksha_ai_worker
    restart: unless-stopped
    environment:
      - CENTRAL_URL=http://central-platform:3000/api/v1
      - TRITON_HOST=triton
      - TRITON_PORT=8001
      - TRITON_BACKEND=onnx
      - MAX_CAPACITY=100
    depends_on:
      - central-platform
    networks:
      - gujraksha-net

  # ============================================================================
  # 2.1 Live AI Vision Streaming Service (CPU Mode)
  # ============================================================================
  ai-stream-service:
    build:
      context: ./3_ANPR_EDGE_WORKER
      dockerfile: Dockerfile
    container_name: gujraksha_ai_stream
    restart: unless-stopped
    command: ["python3", "ai_stream_service.py", "--port", "8090"]
    ports:
      - "8090:8090"
    environment:
      - CENTRAL_URL=http://central-platform:3000/api/v1
    depends_on:
      - central-platform
    networks:
      - gujraksha-net

  # ============================================================================
  # 3. Stream Gateway (MediaMTX RTSP / WebRTC WHEP / HLS Video Server)
  # ============================================================================
  stream-gateway:
    image: bluenviron/mediamtx:latest
    container_name: gujraksha_stream_gateway
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP Stream Ingest & Egress
      - "8888:8888"   # HLS Streaming
      - "8889:8889"   # WebRTC / WHEP Streaming
      - "1935:1935"   # RTMP Streaming
    networks:
      - gujraksha-net

  # ============================================================================
  # 4. PostgreSQL + PostGIS Spatial Database Engine
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gujraksha_postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gujraksha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gujraksha-net

networks:
  gujraksha-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
